<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no, viewport-fit=cover"
		/>
		<title>Spotinext - A Spotify Song Downloader Platform</title>
		<meta name="description" content="Download current playing song from Spotify with Spotinext." />
		<meta name="theme-color" content="#161618" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@500;700&display=swap"
		/>
		<link rel="apple-touch-icon" href="/icon-512x512.png" />
		<meta property="og:title" content="Spotinext - A Spotify Song Downloader Platform" />
		<meta property="og:description" content="Download current playing song from Spotify with Spotinext." />
		<meta property="og:site_name" content="Spotinext" />
		<meta property="og:image" content="/og-banner.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Spotinext - A Spotify Song Downloader Platform" />
		<meta name="twitter:image" content="/og-banner.png" />
		<script>
			// apply the saved theme before first paint to avoid a flash
			try {
				const t = localStorage.getItem("theme") || "system";
				const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
