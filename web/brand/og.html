<!doctype html>
<!-- Source for public/og-banner.png (1200x630). Regenerate with brand/build.sh -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@700&display=block"
		/>
		<style>
			:root {
				--ink: #151517;
				--paper: #f6f1e7;
				--bg: #161618;
				--green: #1ed760;
				--pink: #ff6ab0;
				--yellow: #ffd43b;
				--violet: #9b7bff;
				--cyan: #4fd8eb;
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				position: relative;
				background: var(--bg);
				background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1.5px, transparent 1.5px);
				background-size: 26px 26px;
				color: var(--paper);
				font-family: "DM Sans", sans-serif;
			}
			.sticker {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				border: 3px solid var(--ink);
				border-radius: 999px;
				padding: 6px 16px;
				font: 700 18px "JetBrains Mono", monospace;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--ink);
				box-shadow: 3px 3px 0 #000;
			}
			.brand {
				position: absolute;
				left: 72px;
				top: 60px;
				display: flex;
				align-items: center;
				gap: 14px;
				font: 800 40px "Bricolage Grotesque", sans-serif;
				letter-spacing: -0.02em;
			}
			.brand svg {
				width: 48px;
				height: 48px;
			}
			h1 {
				position: absolute;
				left: 72px;
				top: 180px;
				font: 800 86px/0.92 "Bricolage Grotesque", sans-serif;
				letter-spacing: -0.035em;
			}
			.hl {
				display: inline-block;
				margin-top: 10px;
				padding: 0 18px 6px;
				transform: rotate(-1.5deg);
				background: var(--green);
				color: var(--ink);
				border: 4px solid var(--ink);
				border-radius: 22px;
				box-shadow: 7px 7px 0 #000;
			}
			.sub {
				position: absolute;
				left: 72px;
				bottom: 64px;
				display: flex;
				gap: 14px;
			}
			.chip {
				display: flex;
				align-items: center;
				gap: 10px;
				border: 3px solid #3a3a42;
				background: #1f1f23;
				border-radius: 999px;
				padding: 8px 20px 8px 8px;
				font: 600 22px "DM Sans", sans-serif;
				box-shadow: 4px 4px 0 #000;
			}
			.dot {
				width: 30px;
				height: 30px;
				border-radius: 999px;
				border: 3px solid var(--ink);
			}
			/* record + sleeve */
			.vinyl {
				position: absolute;
				right: 56px;
				top: 135px;
				width: 340px;
				height: 340px;
				z-index: 1;
				border-radius: 50%;
				border: 4px solid #000;
				background: repeating-radial-gradient(circle at center, #151517 0 3px, #24242a 3px 5px), #151517;
				box-shadow: 8px 8px 0 #000;
			}
			.vinyl::after {
				content: "";
				position: absolute;
				inset: 0;
				border-radius: 50%;
				background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent 40%, transparent 60%, rgba(255, 255, 255, 0.08));
			}
			.label {
				position: absolute;
				left: 50%;
				top: 50%;
				width: 130px;
				height: 130px;
				transform: translate(-50%, -50%);
				border-radius: 50%;
				border: 4px solid var(--ink);
				background: var(--pink);
				z-index: 1;
			}
			.label::after {
				content: "";
				position: absolute;
				left: 50%;
				top: 50%;
				width: 20px;
				height: 20px;
				transform: translate(-50%, -50%);
				border-radius: 50%;
				background: var(--ink);
			}
			.sleeve {
				position: absolute;
				right: 230px;
				top: 160px;
				width: 260px;
				height: 290px;
				z-index: 2;
				transform: rotate(-7deg);
				border: 4px solid var(--ink);
				border-radius: 22px;
				background: var(--violet);
				box-shadow: 9px 9px 0 #000;
				display: grid;
				place-items: center;
				text-align: center;
				color: var(--ink);
			}
			.sleeve b {
				display: block;
				font: 800 74px/0.9 "Bricolage Grotesque", sans-serif;
				letter-spacing: -0.03em;
			}
			.sleeve span {
				display: block;
				margin-top: 18px;
				font: 700 16px "JetBrains Mono", monospace;
				letter-spacing: 0.2em;
				text-transform: uppercase;
			}
		</style>
	</head>
	<body>
		<div class="brand">
			<svg viewBox="0 0 32 32" aria-hidden="true">
				<circle cx="16" cy="16" r="14.5" fill="#151517" stroke="#f6f1e7" stroke-width="2" />
				<circle cx="16" cy="16" r="10" fill="none" stroke="#2a2a2f" stroke-width="1.2" />
				<circle cx="16" cy="16" r="6.5" fill="#1ED760" stroke="#151517" stroke-width="1.5" />
				<circle cx="16" cy="16" r="1.6" fill="#151517" />
			</svg>
			spotinext
			<span class="sticker" style="background: var(--yellow); transform: rotate(-6deg); font-size: 14px; padding: 2px 10px">beta</span>
		</div>

		<h1>
			Your music,<br />
			<span class="hl">offline</span> &amp; tagged.
		</h1>

		<div class="sub">
			<div class="chip"><span class="dot" style="background: var(--green)"></span>One-click downloads</div>
			<div class="chip"><span class="dot" style="background: var(--pink)"></span>Album art + tags</div>
			<div class="chip"><span class="dot" style="background: var(--cyan)"></span>Whole playlists</div>
		</div>

		<div class="vinyl"><div class="label"></div></div>
		<div class="sleeve">
			<div>
				<b>side<br />A</b>
				<span>your top 10</span>
			</div>
		</div>
		<span class="sticker" style="position: absolute; right: 80px; bottom: 130px; z-index: 3; background: var(--yellow); transform: rotate(6deg)">m4a · mp3</span>
	</body>
</html>
